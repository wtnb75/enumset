[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enumset"
dynamic = ["version"]
description = "set of enum.Enum"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Watanabe Takashi", email = "wtnb75@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/wtnb75/enumset"

[tool.hatch.version]
path = "enumset/version.py"
pattern = "VERSION = ['\"](?P<version>[^'\"]+)['\"]"

[tool.hatch.build.targets.wheel]
packages = ["enumset"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-github-actions-annotate-failures",
    "ruff",
    "pdoc",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "--cov-report=html:cover --cov-report=term --cov-branch --cov-reset --cov=enumset --doctest-modules"
